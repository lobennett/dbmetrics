[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dbmetrics"
version = "0.3.0"
description = "Offline DBP video metrics"
requires-python = ">=3.10,<3.13"
dependencies = []

[project.optional-dependencies]
technical = ["numpy>=2,<3", "opencv-python-headless>=4.10,<5"]
youtube = ["yt-dlp==2026.8.19"]
notebooks = ["ipykernel>=6.29", "jupyterlab>=4.2", "matplotlib>=3.9", "nbconvert>=7.16", "numpy>=2,<3", "opencv-python-headless>=4.10,<5"]

[tool.hatch.build.targets.wheel]
packages = ["src/dbmetrics"]
